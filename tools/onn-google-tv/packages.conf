# Debloat plan for a Walmart onn Google TV.
# Format:  category | package | reason
#
# Categories:
#   ads       Google TV home-screen ads / sponsored rows / recommendations
#   tracking  usage reporting, feedback, attribution, bug upload
#   bundled   preloaded apps that were not asked for
#   ask       has a real trade-off; the script asks you per item, default NO
#   launcher  the stock home screen; handled by 20-launcher.sh, not 10-debloat.sh
#
# Everything is applied with "pm disable-user --user 0" only (reversible).
# Packages that are not present on the TV are skipped silently.
# Anything matching the protected list in lib/common.sh is refused even if listed here.

# --- Google TV home screen, recommendations, watch tracking -------------------
launcher | com.google.android.apps.tv.launcherx    | Google TV home: "For You" sponsored rows, ads, autoplay trailers, watch-history based recommendations. Replaced by FLauncher.
launcher | com.google.android.tungsten.setupwraith | Home-screen fallback/setup helper that forces Google TV home back when launcherx is off. Must be disabled with it.
ads      | com.google.android.tvrecommendations    | Android TV recommendations row service (content suggestions pushed into the home screen).

# --- Usage reporting / telemetry ----------------------------------------------
tracking | com.google.android.feedback             | Google feedback & crash-report uploader.
tracking | com.google.android.tv.bugreportsender   | Bug report sender (uploads device reports to Google).
tracking | com.google.android.partnersetup         | Google Partner Setup: RLZ attribution / partner tracking. Not needed after setup.
tracking | com.google.android.apps.tv.dreamx       | Google TV ambient screensaver that cycles promoted content and phones home for it. The basic Android screensaver stays available.

# --- Bundled Google apps you did not ask for ----------------------------------
bundled  | com.google.android.videos               | Google TV / Play Movies app. Purchases stay in your Google account.
bundled  | com.google.android.youtube.tvmusic      | YouTube Music.
bundled  | com.google.android.youtube.tvkids       | YouTube Kids.
bundled  | com.google.android.play.games           | Google Play Games.
bundled  | com.google.android.syncadapters.calendar| Calendar sync adapter, useless on a TV.

# --- Ask me first (real trade-offs) -------------------------------------------
# (com.google.android.tv.remote.service is in the protected list: you said never touch the remote.)
ask      | com.google.android.katniss              | Google app for TV: Assistant and voice search via the remote's mic. Disabling removes voice search.
ask      | com.google.android.apps.mediashell      | Chromecast built-in. Disabling removes casting from your phone.
ask      | com.google.android.backdrop             | Android TV "Backdrop" photo screensaver (pulls Google Photos/art). Only disable if you want no screensaver.
ask      | com.google.android.marvin.talkback      | TalkBack screen reader (accessibility).
ask      | com.google.android.tts                  | Text-to-speech engine. Used by TalkBack and some Assistant replies.
